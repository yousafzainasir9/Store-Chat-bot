[project]
name = "store-chat-bot-backend"
version = "0.1.0"
description = "Fashion & Clothing AI Support Chatbot — FastAPI backend (RAG + Shopify tool-calling)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "yousafzainasir9" }]

dependencies = [
    # --- Web / API ---
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12",       # form / file uploads (image input later)
    "httpx>=0.27,<0.28",              # async HTTP (Shopify, providers)
    "sse-starlette>=2.1,<3.0",        # SSE streaming for /chat
    # --- Observability ---
    "structlog>=24.4,<25.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # --- Datastores (wired in later phases) ---
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2.0",
    "redis>=5.1,<6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "black>=24.10,<25.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "pre-commit>=4.0,<5.0",
    "types-redis",
]
# Real LLM + embedding providers (deployed environments).
providers = [
    "openai>=1.54,<2.0",
    "google-generativeai>=0.8,<1.0",
]
# Production vector store.
vector = [
    "qdrant-client>=1.12,<2.0",
]
# Cross-encoder reranker / image embeddings (heavier; opt-in).
ml = [
    "sentence-transformers>=3.3,<4.0",
    "pillow>=10.0,<12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------------
# Tooling configuration (enforced by pre-commit + CI)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # allow fake secrets in tests

[tool.black]
line-length = 100
target-version = ["py312"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "google.*",
    "qdrant_client.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["tests/*", "app/main.py"]
