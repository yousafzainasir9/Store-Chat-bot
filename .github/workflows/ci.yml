name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint -> type -> test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests eval scripts

      - name: Format check (black)
        run: black --check app tests eval scripts

      - name: Type check (mypy --strict)
        run: mypy app

      - name: Test (pytest + coverage)
        run: pytest

      - name: Eval gate (offline RAG metrics)
        run: python -m eval.run_eval --k 5 --min-recall 0.85 --min-answer 0.9 --min-refusal 0.9

  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
