name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint -> type -> test -> eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (uv)
        # Uses uv.lock if present (reproducible); resolves from pyproject otherwise.
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check app tests eval scripts

      - name: Format check (black)
        run: uv run black --check app tests eval scripts

      - name: Type check (mypy --strict)
        run: uv run mypy app

      - name: Test (pytest + coverage)
        run: uv run pytest

      - name: Eval gate (offline RAG metrics)
        run: uv run python -m eval.run_eval --k 5 --min-recall 0.85 --min-answer 0.9 --min-refusal 0.9

  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
